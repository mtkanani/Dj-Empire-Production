<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Primary SEO -->
    <title>DJ Empire Productions | Event Ticket Booking</title>
    <meta name="description" content="Book tickets for DJ Empire Productions events. Fast, secure online ticket booking platform for concerts, parties, and live events." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://djempireproductions.com" />
    <meta name="keywords" content="DJ Empire Productions, event tickets, book tickets, DJ events, live events, concerts" />
    <meta name="author" content="DJ Empire Productions" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://djempireproductions.com" />
    <meta property="og:title" content="DJ Empire Productions | Event Ticket Booking" />
    <meta property="og:description" content="Book tickets for DJ Empire Productions events. Fast, secure online ticket booking platform for concerts, parties, and live events." />
    <meta property="og:image" content="https://djempireproductions.com/logo.png" />
    <meta property="og:site_name" content="DJ Empire Productions" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJ Empire Productions | Event Ticket Booking" />
    <meta name="twitter:description" content="Book tickets for DJ Empire Productions events. Fast, secure online ticket booking." />
    <meta name="twitter:image" content="https://djempireproductions.com/logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
        min-width: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        min-width: 0;
      }
      /* Force mobile viewport */
      @viewport {
        width: device-width;
      }
      /* Responsive overrides to adapt inline-styled components for mobile */
      @media (max-width: 768px) {
        .nav-inner { padding: 12px 16px !important; }
        .nav-brand img { height: 48px !important; }
        .nav-links { display: none !important; }
        .nav-toggle { display: block !important; }
        .nav-app { gap: 6px !important; padding: 4px !important; }
        h1 { font-size: 40px !important; line-height: 1.05 !important; }
        h2 { font-size: 24px !important; }
        p { font-size: 15px !important; }
        .page-section, .hero, .section { padding-left: 16px !important; padding-right: 16px !important; }
        .site-nav { position: sticky !important; top: 0; }
        .mobile-menu button { font-size: 16px !important; }
        button[class*="Btn"] { padding: 12px 20px !important; font-size: 15px !important; }
        /* Force all containers to be full width on mobile */
        div[style*="maxWidth"] {
          width: 100% !important;
          max-width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
